description: "Building technology to make our roads safer."
bio: "I've spent my career working on one question: how do you know a machine is safe to let loose in the real world? My Ph.D. was in autonomous system safety, testing systems where software, hardware, and the messy physical world all meet. The biggest thing I took away is that safety isn't just good code. You need proof, and the world keeps changing underneath you.\n\nThat's why I co-founded SinManos. We check whether vehicles, human-driven or autonomous, actually follow the rules of the road. It turns out to be one of the best early signs of how safely a fleet is driving, and we help fleets, insurers, and regulators see it at scale.\n\nOutside work, you'll find me playing hockey, playing video games, or reading a good book."
