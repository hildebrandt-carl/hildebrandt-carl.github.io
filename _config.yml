url: "https://carl-h.com"

# Publications and patents are only listed on the main page, so they don't get pages of their own
collections:
  - publications
  - patents

analytics:
  google:
    tracking_id: "G-FGCR15Z3FK"

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/fonts/README
  - assets/fonts/icomoon.json

sass:
  style: compressed
